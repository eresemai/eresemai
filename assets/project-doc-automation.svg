<svg role="img" viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
<title>Enterprise document automation agent flow</title>
<desc>Animated terminal-styled diagram showing a request flowing from client through an orchestrator agent to research and legal agents, into a RAG pipeline, an implementation agent, human review, and final delivery, with a moving packet along the animated path.</desc>
<defs>
<clipPath id="cardClipD"><rect x="1" y="1" width="698" height="338" rx="16"/></clipPath>
<linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7F77DD"/><stop offset="100%" stop-color="#5DCAA5"/></linearGradient>
</defs>
<g clip-path="url(#cardClipD)">
<rect x="1" y="1" width="698" height="338" fill="#0d1117"/>
<rect x="1" y="1" width="698" height="30" fill="#161b22"/>
<circle cx="22" cy="16" r="5" fill="#ff5f56"/>
<circle cx="40" cy="16" r="5" fill="#ffbd2e"/>
<circle cx="58" cy="16" r="5" fill="#27c93f"/>
<text x="82" y="20" font-size="11" fill="#8b949e" font-family="ui-monospace,monospace">enterprise-document-automation</text>

<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600">

<rect x="24" y="60" width="120" height="44" rx="8" fill="#211a35" stroke="#534AB7"/>
<text x="84" y="86" text-anchor="middle" fill="#c9a8ff">Orchestrator</text>

<rect x="24" y="150" width="120" height="44" rx="8" fill="#12291f" stroke="#1D9E75"/>
<text x="84" y="176" text-anchor="middle" fill="#7ee2ac">Research agent</text>
<rect x="24" y="240" width="120" height="44" rx="8" fill="#331a24" stroke="#D4537E"/>
<text x="84" y="266" text-anchor="middle" fill="#f0a8c3">Legal agent</text>

<rect x="290" y="150" width="120" height="44" rx="8" fill="#0f2036" stroke="#378ADD"/>
<text x="350" y="176" text-anchor="middle" fill="#a8cef7">RAG pipeline</text>

<rect x="290" y="240" width="120" height="44" rx="8" fill="#332019" stroke="#F0997B"/>
<text x="350" y="266" text-anchor="middle" fill="#f5b79a">Implementation</text>

<rect x="556" y="150" width="120" height="44" rx="8" fill="#161b22" stroke="#8b949e"/>
<text x="616" y="170" text-anchor="middle" fill="#e6edf3">Human review</text>
<text x="616" y="184" text-anchor="middle" fill="#8b949e" font-weight="400" font-size="9.5">critical decisions</text>

<rect x="556" y="240" width="120" height="44" rx="8" fill="#0d2e21" stroke="#39d353"/>
<text x="616" y="266" text-anchor="middle" fill="#7ee2ac">Delivered</text>

<path d="M84,104 L84,150" stroke="#534AB7" stroke-width="2" fill="none"/>
<path d="M84,104 L84,240" stroke="#534AB7" stroke-width="2" fill="none"/>
<path d="M144,172 L290,172" stroke="#1D9E75" stroke-width="2" fill="none"/>
<path d="M144,262 L290,262" stroke="#D4537E" stroke-width="2" fill="none"/>
<path d="M350,194 L350,240" stroke="#378ADD" stroke-width="2" fill="none"/>
<path d="M410,262 L556,262" stroke="#F0997B" stroke-width="2" fill="none"/>
<path d="M616,240 L616,194" stroke="#8b949e" stroke-width="2" fill="none"/>

<circle r="5" fill="url(#flowGrad)"><animateMotion dur="3.6s" repeatCount="indefinite" path="M84,104 Q84,172 144,172 Q290,172 350,194 Q350,240 410,262 Q556,262 616,240"/></circle>
</g>
</g>
<rect x="1" y="1" width="698" height="338" rx="16" fill="none" stroke="#30363d"/>
</svg>
