<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Interactive 3D presentation platforms</title>
  <desc id="d">Essence diagram: ingest → process → render → edge delivery → viewer. No product brands.</desc>
  <defs>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.045"/>
    </filter>
    <linearGradient id="flow3d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B6CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5B6CFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5B6CFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="#FBFBFD"/>
  <text x="48" y="40" font-family="SF Pro Display, Inter, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="3.5" fill="#86868B">ERESEMAI</text>
  <text x="48" y="78" font-family="SF Pro Display, Inter, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#1D1D1F">Interactive 3D presentation platforms</text>
  <text x="48" y="106" font-family="SF Pro Text, Inter, -apple-system, sans-serif" font-size="14" fill="#6E6E73">Ingest · process · render · edge delivery · real-time viewer UX</text>

  <line x1="100" y1="200" x2="1100" y2="200" stroke="#E5E5EA" stroke-width="2"/>
  <line x1="100" y1="200" x2="1100" y2="200" stroke="url(#flow3d)" stroke-width="2.5"/>

  <g font-family="SF Pro Text, Inter, -apple-system, sans-serif">
    <rect x="72" y="160" width="152" height="80" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh)"/>
    <rect x="72" y="160" width="152" height="80" rx="18" fill="none" stroke="#5B6CFF" stroke-width="1.25" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.16;0.18;0.5;0.8;0.98;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="148" cy="184" r="5" fill="#5B6CFF">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="148" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">Ingest</text>

    <rect x="268" y="160" width="152" height="80" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh)"/>
    <rect x="268" y="160" width="152" height="80" rx="18" fill="none" stroke="#5B6CFF" stroke-width="1.25" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.16;0.18;0.34;0.36;0.7;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="344" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">Process</text>
    <text x="344" y="212" text-anchor="middle" font-size="11" fill="#86868B">API / services</text>

    <rect x="464" y="160" width="152" height="80" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh)"/>
    <rect x="464" y="160" width="152" height="80" rx="18" fill="none" stroke="#5B6CFF" stroke-width="1.25" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.34;0.36;0.38;0.52;0.54;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="540" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">Render</text>
    <text x="540" y="212" text-anchor="middle" font-size="11" fill="#86868B">3D pipeline</text>

    <rect x="660" y="160" width="152" height="80" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh)"/>
    <rect x="660" y="160" width="152" height="80" rx="18" fill="none" stroke="#5B6CFF" stroke-width="1.25" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.52;0.54;0.56;0.58;0.74;0.76" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="736" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">Edge</text>
    <text x="736" y="212" text-anchor="middle" font-size="11" fill="#86868B">delivery</text>

    <rect x="856" y="160" width="200" height="80" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh)"/>
    <rect x="856" y="160" width="200" height="80" rx="18" fill="none" stroke="#34C759" stroke-width="1.25" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;1;1;0" keyTimes="0;0.72;0.74;0.76;0.78;0.8;0.96;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="884" cy="184" r="4" fill="#34C759"/>
    <text x="956" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">Viewer UX</text>
    <text x="956" y="212" text-anchor="middle" font-size="11" fill="#86868B">real-time inventory</text>
  </g>

  <text x="48" y="290" font-family="SF Pro Text, Inter, sans-serif" font-size="12" fill="#86868B">Go · TypeScript · React · PostgreSQL · Edge / Workers</text>
</svg>
