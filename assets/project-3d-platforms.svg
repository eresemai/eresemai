<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">3D for real estate developers</title>
  <desc id="d">Real estate 3D interactives, visualization, and marketing flow with packets and stage pulses.</desc>
  <defs>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.045"/>
    </filter>
    <linearGradient id="flow3d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B6CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5B6CFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5B6CFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="1.25s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="1.25s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="#FBFBFD"/>
  <text x="48" y="40" font-family="SF Pro Display, Inter, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="3.5" fill="#86868B">ERESEMAI</text>
  <text x="48" y="78" font-family="SF Pro Display, Inter, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#1D1D1F">3D for real estate developers</text>
  <text x="48" y="106" font-family="SF Pro Text, Inter, -apple-system, sans-serif" font-size="14" fill="#6E6E73">Interactives · visualization · marketing · edge delivery · buyer UX</text>

  <line x1="100" y1="200" x2="1100" y2="200" stroke="#E5E5EA" stroke-width="2"/>
  <line x1="100" y1="200" x2="1100" y2="200" stroke="url(#flow3d)" stroke-width="3"/>

  <circle r="4.5" fill="#5B6CFF">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M148,200 L956,200"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="0.55s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#5B6CFF" opacity="0.85">
    <animateMotion dur="2.2s" begin="0.55s" repeatCount="indefinite" path="M148,200 L956,200"/>
  </circle>
  <circle r="3.5" fill="#34C759" opacity="0.9">
    <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M148,200 L956,200"/>
  </circle>
  <circle r="2.5" fill="#5B6CFF" opacity="0.7">
    <animateMotion dur="2.2s" begin="1.65s" repeatCount="indefinite" path="M148,200 L956,200"/>
  </circle>
  <circle r="2.2" fill="#5B6CFF" opacity="0.5">
    <animateMotion dur="3s" repeatCount="indefinite" path="M956,200 L148,200"/>
  </circle>

  <g font-family="SF Pro Text, Inter, -apple-system, sans-serif">
    <rect x="72" y="160" width="152" height="80" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh)"/>
    <rect x="72" y="160" width="152" height="80" rx="18" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.16;0.18;0.5;0.8;0.98;1" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="148" cy="184" r="5" fill="#5B6CFF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;7;4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="148" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">Assets</text>

    <rect x="268" y="160" width="152" height="80" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh)"/>
    <rect x="268" y="160" width="152" height="80" rx="18" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.16;0.18;0.34;0.36;0.7;1" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="344" cy="184" r="4" fill="#D2D2D7">
      <animate attributeName="fill" values="#D2D2D7;#D2D2D7;#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7" keyTimes="0;0.16;0.18;0.34;0.36;1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;4;6;6;4;4" keyTimes="0;0.16;0.18;0.34;0.36;1" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <text x="344" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">Pipeline</text>
    <text x="344" y="224" text-anchor="middle" font-size="11" fill="#86868B">Go / TS services</text>

    <rect x="464" y="160" width="152" height="80" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh)"/>
    <rect x="464" y="160" width="152" height="80" rx="18" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.34;0.36;0.38;0.52;0.54;1" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="540" cy="184" r="4" fill="#D2D2D7">
      <animate attributeName="fill" values="#D2D2D7;#D2D2D7;#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7" keyTimes="0;0.36;0.38;0.52;0.54;1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;4;6;6;4;4" keyTimes="0;0.36;0.38;0.52;0.54;1" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <text x="540" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">3D Viz</text>
    <text x="540" y="224" text-anchor="middle" font-size="11" fill="#86868B">3D interactive</text>

    <rect x="660" y="160" width="152" height="80" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh)"/>
    <rect x="660" y="160" width="152" height="80" rx="18" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.52;0.54;0.56;0.58;0.74;0.76" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="736" cy="184" r="4" fill="#D2D2D7">
      <animate attributeName="fill" values="#D2D2D7;#D2D2D7;#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7" keyTimes="0;0.56;0.58;0.74;0.76;1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;4;6;6;4;4" keyTimes="0;0.56;0.58;0.74;0.76;1" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <text x="736" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">Publish</text>
    <text x="736" y="224" text-anchor="middle" font-size="11" fill="#86868B">edge + embed</text>

    <rect x="856" y="160" width="200" height="80" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh)"/>
    <rect x="856" y="160" width="200" height="80" rx="18" fill="none" stroke="#34C759" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;1;1;0" keyTimes="0;0.72;0.74;0.76;0.78;0.8;0.96;1" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="884" cy="184" r="4" fill="#34C759">
      <animate attributeName="r" values="3.5;6;3.5" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="956" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">Interactive</text>
    <text x="956" y="224" text-anchor="middle" font-size="11" fill="#86868B">3D marketing UX</text>
  </g>

  <text x="48" y="290" font-family="SF Pro Text, Inter, sans-serif" font-size="12" fill="#86868B">Go · TypeScript · React · PostgreSQL · Edge / Workers</text>
</svg>
