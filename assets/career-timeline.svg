<svg role="img" viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
<title>Career timeline from 2005 to 2026</title>
<desc>Animated dark terminal-styled timeline: 2005 state governance and law enforcement, 2017 first ventures, 2018 to present attorney and managing partner, 2022 to present LL.M. Munich, 2025 AI research and engineering begins, 2026 dual track research times engineering.</desc>
<defs>
<clipPath id="cardClipB"><rect x="1" y="1" width="698" height="218" rx="16"/></clipPath>
<linearGradient id="lineGradB" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1D9E75"/><stop offset="50%" stop-color="#378ADD"/><stop offset="100%" stop-color="#D4537E"/></linearGradient>
</defs>
<g clip-path="url(#cardClipB)">
<rect x="1" y="1" width="698" height="218" fill="#0d1117"/>
<rect x="1" y="1" width="698" height="30" fill="#161b22"/>
<circle cx="22" cy="16" r="5" fill="#ff5f56"/>
<circle cx="40" cy="16" r="5" fill="#ffbd2e"/>
<circle cx="58" cy="16" r="5" fill="#27c93f"/>
<text x="82" y="20" font-size="11" fill="#8b949e" font-family="ui-monospace,monospace">2005 &#8594; 2026</text>

<line x1="60" y1="120" x2="650" y2="120" stroke="url(#lineGradB)" stroke-width="3" stroke-dasharray="590" stroke-dashoffset="590">
<animate attributeName="stroke-dashoffset" from="590" to="0" dur="2.4s" fill="freeze"/>
</line>

<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
