<circle cx="60" cy="120" r="7" fill="#1D9E75"/>
<text x="60" y="96" text-anchor="middle" font-size="10.5" fill="#e6edf3" font-weight="600">2005</text>
<text x="60" y="146" text-anchor="middle" font-size="9" fill="#8b949e">state governance</text>
<text x="60" y="158" text-anchor="middle" font-size="9" fill="#8b949e">&amp; law enforcement</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.5s" fill="freeze"/>
<circle cx="178" cy="120" r="7" fill="#5DCAA5"/>
<text x="178" y="96" text-anchor="middle" font-size="10.5" fill="#e6edf3" font-weight="600">2017</text>
<text x="178" y="146" text-anchor="middle" font-size="9" fill="#8b949e">first ventures &amp;</text>
<text x="178" y="158" text-anchor="middle" font-size="9" fill="#8b949e">team leadership</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
<circle cx="296" cy="120" r="7" fill="#378ADD"/>
<text x="296" y="96" text-anchor="middle" font-size="10.5" fill="#e6edf3" font-weight="600">2018&#8211;present</text>
<text x="296" y="146" text-anchor="middle" font-size="9" fill="#8b949e">attorney &amp;</text>
<text x="296" y="158" text-anchor="middle" font-size="9" fill="#8b949e">managing partner</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.15s" dur="0.5s" fill="freeze"/>
<circle cx="414" cy="120" r="7" fill="#85B7EB"/>
<text x="414" y="96" text-anchor="middle" font-size="10.5" fill="#e6edf3" font-weight="600">2022&#8211;present</text>
<text x="414" y="146" text-anchor="middle" font-size="9" fill="#8b949e">LL.M.</text>
<text x="414" y="158" text-anchor="middle" font-size="9" fill="#8b949e">Munich</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
<circle cx="532" cy="120" r="7" fill="#7F77DD"/>
<text x="532" y="96" text-anchor="middle" font-size="10.5" fill="#e6edf3" font-weight="600">2025</text>
<text x="532" y="146" text-anchor="middle" font-size="9" fill="#8b949e">AI research &amp;</text>
<text x="532" y="158" text-anchor="middle" font-size="9" fill="#8b949e">engineering begin</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.85s" dur="0.5s" fill="freeze"/>
<circle cx="640" cy="120" r="8" fill="#D4537E"/>
<text x="622" y="96" text-anchor="middle" font-size="10.5" fill="#e6edf3" font-weight="600">2026</text>
<text x="622" y="146" text-anchor="middle" font-size="9" fill="#8b949e">research &#215;</text>
<text x="622" y="158" text-anchor="middle" font-size="9" fill="#8b949e">engineering</text>
