<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">How I build — AI SDLC, Agentic Engineering, SDD, Agentic Architecture</title>
  <desc id="d">Four practice cards with sequential accent highlight, connector packets, and node pulses.</desc>
  <defs>
    <filter id="cardSh" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
    <linearGradient id="connFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B6CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5B6CFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5B6CFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="#FBFBFD"/>
  <text x="48" y="44" font-family="SF Pro Display, Inter, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="3.5" fill="#86868B">ERESEMAI</text>
  <text x="48" y="84" font-family="SF Pro Display, Inter, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#1D1D1F">How I build</text>

  <!-- connector baseline between cards -->
  <line x1="176" y1="186" x2="1020" y2="186" stroke="#E5E5EA" stroke-width="1.5"/>
  <line x1="176" y1="186" x2="1020" y2="186" stroke="url(#connFlow)" stroke-width="2.5"/>
  <circle r="3.5" fill="#5B6CFF">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M176,186 L1020,186"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#5B6CFF" opacity="0.7">
    <animateMotion dur="3.5s" begin="1.1s" repeatCount="indefinite" path="M176,186 L1020,186"/>
  </circle>
  <circle r="2.5" fill="#34C759" opacity="0.8">
    <animateMotion dur="3.5s" begin="2.2s" repeatCount="indefinite" path="M176,186 L1020,186"/>
  </circle>

  <g font-family="SF Pro Text, Inter, -apple-system, sans-serif">
    <!-- Card 1 -->
    <rect x="48" y="112" width="256" height="148" rx="22" fill="#FFFFFF" stroke="#ECECEF" filter="url(#cardSh)"/>
    <rect x="48" y="112" width="256" height="148" rx="22" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0;0;0;0" keyTimes="0;0.02;0.20;0.22;0.25;0.5;0.75;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cx="76" cy="148" r="5" fill="#5B6CFF">
      <animate attributeName="opacity" values="0.35;1;0.35;0.35;0.35" keyTimes="0;0.1;0.2;0.25;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;7;4;4;4" keyTimes="0;0.1;0.2;0.25;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <text x="92" y="153" font-size="15" font-weight="600" fill="#1D1D1F">AI SDLC</text>
    <text x="76" y="188" font-size="13" fill="#6E6E73">Spec → implement →</text>
    <text x="76" y="208" font-size="13" fill="#6E6E73">validate → ship</text>
    <text x="76" y="236" font-size="11" fill="#86868B">closed feedback loops</text>

    <!-- Card 2 -->
    <rect x="328" y="112" width="256" height="148" rx="22" fill="#FFFFFF" stroke="#ECECEF" filter="url(#cardSh)"/>
    <rect x="328" y="112" width="256" height="148" rx="22" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0;0;0" keyTimes="0;0.22;0.25;0.27;0.45;0.47;0.5;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cx="356" cy="148" r="5" fill="#D2D2D7">
      <animate attributeName="fill" values="#D2D2D7;#D2D2D7;#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7" keyTimes="0;0.25;0.27;0.45;0.47;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;5;7;7;5;5" keyTimes="0;0.25;0.27;0.45;0.47;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <text x="372" y="153" font-size="15" font-weight="600" fill="#1D1D1F">Agentic Engineering</text>
    <text x="356" y="188" font-size="13" fill="#6E6E73">Skills, harnesses,</text>
    <text x="356" y="208" font-size="13" fill="#6E6E73">agent loops in production</text>
    <text x="356" y="236" font-size="11" fill="#86868B">constraints &amp; recovery</text>

    <!-- Card 3 -->
    <rect x="608" y="112" width="256" height="148" rx="22" fill="#FFFFFF" stroke="#ECECEF" filter="url(#cardSh)"/>
    <rect x="608" y="112" width="256" height="148" rx="22" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.47;0.5;0.52;0.54;0.70;0.72;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cx="636" cy="148" r="5" fill="#D2D2D7">
      <animate attributeName="fill" values="#D2D2D7;#D2D2D7;#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7" keyTimes="0;0.5;0.52;0.70;0.72;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;5;7;7;5;5" keyTimes="0;0.5;0.52;0.70;0.72;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <text x="652" y="153" font-size="15" font-weight="600" fill="#1D1D1F">SDD</text>
    <text x="636" y="188" font-size="13" fill="#6E6E73">Specs before code;</text>
    <text x="636" y="208" font-size="13" fill="#6E6E73">TDD where it pays</text>
    <text x="636" y="236" font-size="11" fill="#86868B">OpenSpec / contracts</text>

    <!-- Card 4 -->
    <rect x="888" y="112" width="264" height="148" rx="22" fill="#FFFFFF" stroke="#ECECEF" filter="url(#cardSh)"/>
    <rect x="888" y="112" width="264" height="148" rx="22" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;1;1;0" keyTimes="0;0.70;0.72;0.74;0.75;0.77;0.95;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cx="916" cy="148" r="5" fill="#D2D2D7">
      <animate attributeName="fill" values="#D2D2D7;#D2D2D7;#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7" keyTimes="0;0.75;0.77;0.95;0.97;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;5;7;7;5;5" keyTimes="0;0.75;0.77;0.95;0.97;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <text x="932" y="153" font-size="15" font-weight="600" fill="#1D1D1F">Agentic Architecture</text>
    <text x="916" y="188" font-size="13" fill="#6E6E73">Orchestration, RAG,</text>
    <text x="916" y="208" font-size="13" fill="#6E6E73">eval gates, HITL</text>
    <text x="916" y="236" font-size="11" fill="#86868B">production boundaries</text>
  </g>
</svg>
