      <stop offset="50%" stop-color="#5B6CFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5B6CFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="stFlowV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B6CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5B6CFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5B6CFF" stop-opacity="0"/>
      <animate attributeName="y1" values="-0.5;1" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;1.5" dur="1.7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
