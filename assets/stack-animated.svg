<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Tech stack — Languages, Platform, Agents, 3D, Practice</title>
  <desc id="d">Interactive tech stack board with sequential chip highlights and connecting flow packets.</desc>
  <defs>
    <filter id="stSh" x="-8%" y="-8%" width="116%" height="120%">
