  <line x1="200" y1="108" x2="200" y2="150" stroke="#E5E5EA" stroke-width="1.5"/>
  <line x1="200" y1="108" x2="200" y2="150" stroke="url(#stFlowV)" stroke-width="2"/>
  <line x1="520" y1="108" x2="520" y2="150" stroke="#E5E5EA" stroke-width="1.5"/>
