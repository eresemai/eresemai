<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">AI SDLC — Spec, Agent, Validate, Ship</title>
  <desc id="d">Light Apple-minimal diagram with fast flowing accents, packets, and sequential stage highlight.</desc>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B6CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5B6CFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5B6CFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="1.8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#5B6CFF" flood-opacity="0.32"/>
    </filter>
    <filter id="card">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="#FBFBFD"/>
  <text x="48" y="40" font-family="SF Pro Display, Inter, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="3.5" fill="#86868B">ERESEMAI</text>
  <text x="48" y="78" font-family="SF Pro Display, Inter, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#1D1D1F">AI SDLC</text>
  <text x="48" y="106" font-family="SF Pro Text, Inter, -apple-system, sans-serif" font-size="14" fill="#6E6E73">Spec → Agent → Validate → Ship · closed feedback loop</text>

  <line x1="140" y1="210" x2="1060" y2="210" stroke="#E5E5EA" stroke-width="2"/>
  <line x1="140" y1="210" x2="1060" y2="210" stroke="url(#flow)" stroke-width="3"/>

  <!-- packets on main rail -->
  <circle r="4" fill="#5B6CFF">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M160,210 L920,210"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#5B6CFF" opacity="0.75">
    <animateMotion dur="3.2s" begin="1s" repeatCount="indefinite" path="M160,210 L920,210"/>
  </circle>
  <circle r="3" fill="#34C759" opacity="0.85">
    <animateMotion dur="3.2s" begin="2s" repeatCount="indefinite" path="M160,210 L920,210"/>
  </circle>
  <!-- feedback return path -->
  <path d="M920 248 C920 290, 160 290, 160 248" fill="none" stroke="#E5E5EA" stroke-width="1.5" stroke-dasharray="4 5"/>
  <path d="M920 248 C920 290, 160 290, 160 248" fill="none" stroke="#5B6CFF" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.55">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <circle r="2.5" fill="#5B6CFF" opacity="0.8">
    <animateMotion dur="4s" repeatCount="indefinite" path="M920,248 C920,290 160,290 160,248"/>
  </circle>

  <!-- Spec -->
  <g>
    <rect x="80" y="158" width="160" height="104" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#card)"/>
    <rect x="80" y="158" width="160" height="104" rx="18" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.2;0.22;0.25;0.5;0.75;0.95;0.98;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="160" cy="188" r="8" fill="#D2D2D7">
      <animate attributeName="fill" values="#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7;#D2D2D7;#D2D2D7;#5B6CFF" keyTimes="0;0.2;0.22;0.5;0.75;0.98;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="9;9;7;7;7;7;9" keyTimes="0;0.2;0.22;0.5;0.75;0.98;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="160" y="226" text-anchor="middle" font-family="SF Pro Text, Inter, sans-serif" font-size="15" font-weight="600" fill="#1D1D1F">Spec</text>
    <text x="160" y="246" text-anchor="middle" font-family="SF Pro Text, Inter, sans-serif" font-size="11" fill="#86868B">SDD / contracts</text>
  </g>

  <!-- Agent -->
  <g>
    <rect x="320" y="150" width="176" height="120" rx="20" fill="#FFFFFF" stroke="#ECECEF" filter="url(#card)"/>
    <rect x="320" y="150" width="176" height="120" rx="20" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.22;0.25;0.45;0.47;0.5;0.75;0.98;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="408" cy="188" r="9" fill="#D2D2D7">
      <animate attributeName="fill" values="#D2D2D7;#D2D2D7;#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7;#D2D2D7" keyTimes="0;0.22;0.25;0.45;0.47;0.75;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="8;8;11;11;8;8;8" keyTimes="0;0.22;0.25;0.45;0.47;0.75;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="408" y="226" text-anchor="middle" font-family="SF Pro Text, Inter, sans-serif" font-size="15" font-weight="600" fill="#1D1D1F">Agent</text>
    <text x="408" y="246" text-anchor="middle" font-family="SF Pro Text, Inter, sans-serif" font-size="11" fill="#86868B">implement loop</text>
  </g>

  <!-- Validate -->
  <g>
    <rect x="580" y="158" width="160" height="104" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#card)"/>
    <rect x="580" y="158" width="160" height="104" rx="18" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.45;0.47;0.5;0.52;0.70;0.72;0.75;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="660" cy="188" r="8" fill="#D2D2D7">
      <animate attributeName="fill" values="#D2D2D7;#D2D2D7;#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7" keyTimes="0;0.5;0.52;0.70;0.72;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="7;7;9;9;7;7" keyTimes="0;0.5;0.52;0.70;0.72;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="660" y="226" text-anchor="middle" font-family="SF Pro Text, Inter, sans-serif" font-size="15" font-weight="600" fill="#1D1D1F">Validate</text>
    <text x="660" y="246" text-anchor="middle" font-family="SF Pro Text, Inter, sans-serif" font-size="11" fill="#86868B">eval / tests</text>
  </g>

  <!-- Ship -->
  <g>
    <rect x="840" y="158" width="160" height="104" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#card)"/>
    <rect x="840" y="158" width="160" height="104" rx="18" fill="none" stroke="#34C759" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;1;1;0;0" keyTimes="0;0.70;0.72;0.74;0.75;0.77;0.95;0.97;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="920" cy="188" r="8" fill="#34C759">
      <animate attributeName="opacity" values="0.5;0.5;0.5;1;1;0.5" keyTimes="0;0.72;0.75;0.77;0.95;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="7;7;7;10;10;7" keyTimes="0;0.72;0.75;0.77;0.95;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="920" y="226" text-anchor="middle" font-family="SF Pro Text, Inter, sans-serif" font-size="15" font-weight="600" fill="#1D1D1F">Ship</text>
    <text x="920" y="246" text-anchor="middle" font-family="SF Pro Text, Inter, sans-serif" font-size="11" fill="#86868B">production</text>
  </g>

  <text x="48" y="320" font-family="SF Pro Text, Inter, sans-serif" font-size="12" fill="#86868B">Motion via SVG SMIL — renders in GitHub README.</text>
</svg>
