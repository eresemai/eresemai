<svg role="img" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
<title>Current focus allocation across four practice areas</title>
<desc>Animated dark terminal-styled horizontal bar chart showing relative current focus allocation across legal practice and rule of law, AI and agent engineering, research and policy and academia, and venture and team leadership. Bars grow into place once on load.</desc>
<defs>
<clipPath id="cardClipC"><rect x="1" y="1" width="698" height="258" rx="16"/></clipPath>
<linearGradient id="c1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5DCAA5"/><stop offset="100%" stop-color="#0F6E56"/></linearGradient>
<linearGradient id="c2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#85B7EB"/><stop offset="100%" stop-color="#185FA5"/></linearGradient>
<linearGradient id="c3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#AFA9EC"/><stop offset="100%" stop-color="#534AB7"/></linearGradient>
<linearGradient id="c4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F0997B"/><stop offset="100%" stop-color="#993C1D"/></linearGradient>
</defs>
<g clip-path="url(#cardClipC)">
<rect x="1" y="1" width="698" height="258" fill="#0d1117"/>
<rect x="1" y="1" width="698" height="30" fill="#161b22"/>
<circle cx="22" cy="16" r="5" fill="#ff5f56"/>
<circle cx="40" cy="16" r="5" fill="#ffbd2e"/>
<circle cx="58" cy="16" r="5" fill="#27c93f"/>
<text x="82" y="20" font-size="11" fill="#8b949e" font-family="ui-monospace,monospace">current focus allocation</text>

<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5">
<text x="24" y="70" fill="#e6edf3">Legal practice &amp; rule of law</text>
<rect x="24" y="78" width="500" height="14" rx="7" fill="#161b22"/>
<rect x="24" y="78" height="14" rx="7" fill="url(#c1)" width="0"><animate attributeName="width" from="0" to="450" dur="1.1s" begin="0.1s" fill="freeze"/></rect>

<text x="24" y="118" fill="#e6edf3">AI &amp; agent engineering</text>
<rect x="24" y="126" width="500" height="14" rx="7" fill="#161b22"/>
<rect x="24" y="126" height="14" rx="7" fill="url(#c2)" width="0"><animate attributeName="width" from="0" to="470" dur="1.1s" begin="0.25s" fill="freeze"/></rect>

<text x="24" y="166" fill="#e6edf3">Research, policy &amp; academia</text>
<rect x="24" y="174" width="500" height="14" rx="7" fill="#161b22"/>
<rect x="24" y="174" height="14" rx="7" fill="url(#c3)" width="0"><animate attributeName="width" from="0" to="360" dur="1.1s" begin="0.4s" fill="freeze"/></rect>

<text x="24" y="214" fill="#e6edf3">Venture &amp; team leadership</text>
<rect x="24" y="222" width="500" height="14" rx="7" fill="#161b22"/>
<rect x="24" y="222" height="14" rx="7" fill="url(#c4)" width="0"><animate attributeName="width" from="0" to="300" dur="1.1s" begin="0.55s" fill="freeze"/></rect>
</g>
</g>
<rect x="1" y="1" width="698" height="258" rx="16" fill="none" stroke="#30363d"/>
</svg>
