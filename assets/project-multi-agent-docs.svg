<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Multi-agent document systems with HITL</title>
  <desc id="d">Orchestrator routes to specialist agents; RAG merge; packets and HITL gate pulse before delivery.</desc>
  <defs>
    <filter id="sh2" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.045"/>
    </filter>
    <linearGradient id="fanFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B6CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5B6CFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5B6CFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="1.3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" fill="#FBFBFD"/>
  <text x="48" y="40" font-family="SF Pro Display, Inter, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="3.5" fill="#86868B">ERESEMAI</text>
  <text x="48" y="78" font-family="SF Pro Display, Inter, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#1D1D1F">Multi-agent document systems</text>
  <text x="48" y="106" font-family="SF Pro Text, Inter, -apple-system, sans-serif" font-size="14" fill="#6E6E73">Orchestrated specialists · RAG · human-in-the-loop review gates</text>

  <!-- connectors -->
  <line x1="220" y1="168" x2="220" y2="198" stroke="#E5E5EA" stroke-width="1.5"/>
  <line x1="220" y1="168" x2="220" y2="198" stroke="url(#fanFlow)" stroke-width="2"/>
  <path d="M220 198 C220 230, 220 230, 360 230" fill="none" stroke="#E5E5EA" stroke-width="1.5"/>
  <path d="M220 198 C220 230, 220 230, 600 230" fill="none" stroke="#E5E5EA" stroke-width="1.5"/>
  <path d="M220 198 C220 230, 220 230, 840 230" fill="none" stroke="#E5E5EA" stroke-width="1.5"/>
  <path d="M220 198 C220 230, 220 230, 360 230" fill="none" stroke="#5B6CFF" stroke-width="1.75" opacity="0.55" stroke-dasharray="5 6">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <path d="M220 198 C220 230, 220 230, 600 230" fill="none" stroke="#5B6CFF" stroke-width="1.75" opacity="0.45" stroke-dasharray="5 6">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="1.5s" begin="0.25s" repeatCount="indefinite"/>
  </path>
  <path d="M220 198 C220 230, 220 230, 840 230" fill="none" stroke="#5B6CFF" stroke-width="1.75" opacity="0.4" stroke-dasharray="5 6">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
  </path>
  <line x1="360" y1="282" x2="600" y2="300" stroke="#E5E5EA" stroke-width="1.5"/>
  <line x1="600" y1="282" x2="600" y2="300" stroke="#E5E5EA" stroke-width="1.5"/>
  <line x1="840" y1="282" x2="600" y2="300" stroke="#E5E5EA" stroke-width="1.5"/>
  <line x1="600" y1="300" x2="980" y2="300" stroke="#E5E5EA" stroke-width="1.5"/>
  <line x1="600" y1="300" x2="980" y2="300" stroke="url(#fanFlow)" stroke-width="2.5"/>

  <!-- packets -->
  <circle r="3.5" fill="#5B6CFF">
    <animateMotion dur="1.1s" repeatCount="indefinite" path="M220,168 L220,198"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="0.55s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#5B6CFF">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M220,198 C220,230 220,230 360,230"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="0.55s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#5B6CFF" opacity="0.85">
    <animateMotion dur="1.9s" begin="0.35s" repeatCount="indefinite" path="M220,198 C220,230 220,230 600,230"/>
  </circle>
  <circle r="3" fill="#5B6CFF" opacity="0.8">
    <animateMotion dur="2s" begin="0.7s" repeatCount="indefinite" path="M220,198 C220,230 220,230 840,230"/>
  </circle>
  <circle r="2.5" fill="#34C759" opacity="0.85">
    <animateMotion dur="2s" begin="1.1s" repeatCount="indefinite" path="M220,198 C220,230 220,230 840,230"/>
  </circle>
  <circle r="4" fill="#34C759">
    <animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite" path="M600,300 L980,300"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="0.55s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#5B6CFF" opacity="0.75">
    <animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M600,300 L980,300"/>
  </circle>
  <circle r="2.5" fill="#5B6CFF" opacity="0.8">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M360,282 L600,300"/>
  </circle>
  <circle r="2.2" fill="#5B6CFF" opacity="0.7">
    <animateMotion dur="1.4s" begin="0.4s" repeatCount="indefinite" path="M840,282 L600,300"/>
  </circle>

  <g font-family="SF Pro Text, Inter, -apple-system, sans-serif">
    <rect x="96" y="128" width="248" height="40" rx="14" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh2)"/>
    <rect x="96" y="128" width="248" height="40" rx="14" fill="none" stroke="#5B6CFF" stroke-width="1.5" opacity="0.4">
      <animate attributeName="opacity" values="0.25;0.85;0.25" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="120" cy="148" r="5" fill="#5B6CFF">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;7;4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="140" y="153" font-size="14" font-weight="600" fill="#1D1D1F">Orchestrator</text>

    <rect x="400" y="128" width="200" height="40" rx="14" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh2)"/>
    <circle cx="424" cy="148" r="3.5" fill="#5B6CFF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="500" y="153" text-anchor="middle" font-size="13" fill="#6E6E73">RAG merge layer</text>

    <rect x="280" y="230" width="160" height="52" rx="16" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh2)"/>
    <rect x="280" y="230" width="160" height="52" rx="16" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0;0;0;0" keyTimes="0;0.05;0.2;0.22;0.25;0.5;0.75;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="304" cy="256" r="4" fill="#D2D2D7">
      <animate attributeName="fill" values="#D2D2D7;#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7" keyTimes="0;0.05;0.2;0.22;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="360" y="261" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">Research</text>

    <rect x="520" y="230" width="160" height="52" rx="16" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh2)"/>
    <rect x="520" y="230" width="160" height="52" rx="16" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0;0;0" keyTimes="0;0.22;0.25;0.27;0.45;0.47;0.5;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="544" cy="256" r="4" fill="#D2D2D7">
      <animate attributeName="fill" values="#D2D2D7;#D2D2D7;#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7" keyTimes="0;0.25;0.27;0.45;0.47;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="261" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">Drafting</text>

    <rect x="760" y="230" width="160" height="52" rx="16" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh2)"/>
    <rect x="760" y="230" width="160" height="52" rx="16" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.45;0.47;0.5;0.52;0.68;0.7;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="784" cy="256" r="4" fill="#D2D2D7">
      <animate attributeName="fill" values="#D2D2D7;#D2D2D7;#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7" keyTimes="0;0.5;0.52;0.68;0.7;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="840" y="261" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">Legal review</text>

    <rect x="980" y="276" width="160" height="48" rx="16" fill="#FFFFFF" stroke="#ECECEF" filter="url(#sh2)"/>
    <rect x="980" y="276" width="160" height="48" rx="16" fill="none" stroke="#34C759" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;1;1;0" keyTimes="0;0.68;0.7;0.72;0.75;0.77;0.95;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="1004" cy="300" r="4" fill="#34C759">
      <animate attributeName="r" values="3.5;6.5;3.5" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1060" y="305" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">HITL gate</text>
  </g>

  <text x="48" y="320" font-family="SF Pro Text, Inter, sans-serif" font-size="12" fill="#86868B">Python · Agents · RAG · Eval harness · HITL</text>
</svg>
