<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Let's collaborate — research, consulting, partnerships, build together</title>
  <desc id="d">Animated CTA panel with pulsing Let's collaborate accent and four collaboration paths; LinkedIn-friendly, no external images.</desc>
  <defs>
    <filter id="ctaSh" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.05"/>
    </filter>
    <filter id="ctaGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#5B6CFF" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="ctaFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B6CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5B6CFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5B6CFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="1.4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="#FBFBFD"/>
  <text x="48" y="36" font-family="SF Pro Display, Inter, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="3.5" fill="#86868B">ERESEMAI</text>

  <!-- accent CTA pill -->
  <rect x="48" y="56" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#ECECEF" filter="url(#ctaSh)"/>
  <rect x="48" y="56" width="280" height="44" rx="22" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0.55" filter="url(#ctaGlow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="76" cy="78" r="6" fill="#5B6CFF">
    <animate attributeName="r" values="5;8.5;5" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;1;0.45" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="96" y="84" font-family="SF Pro Display, Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1D1D1F">Let's collaborate</text>

  <!-- LinkedIn-friendly mark (inline geometric, no external dep) -->
  <g transform="translate(1080, 58)">
    <rect width="72" height="40" rx="12" fill="#FFFFFF" stroke="#ECECEF"/>
    <rect x="10" y="8" width="24" height="24" rx="4" fill="#5B6CFF" opacity="0.15"/>
    <text x="36" y="26" text-anchor="middle" font-family="SF Pro Text, Inter, sans-serif" font-size="11" font-weight="700" fill="#5B6CFF">in</text>
    <circle cx="58" cy="20" r="3" fill="#34C759">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <line x1="100" y1="140" x2="1100" y2="140" stroke="#E5E5EA" stroke-width="1.5"/>
  <line x1="100" y1="140" x2="1100" y2="140" stroke="url(#ctaFlow)" stroke-width="2.5"/>

  <circle r="4" fill="#5B6CFF">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M160,140 L1040,140"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#5B6CFF" opacity="0.8">
    <animateMotion dur="2.5s" begin="0.6s" repeatCount="indefinite" path="M160,140 L1040,140"/>
  </circle>
  <circle r="3.5" fill="#34C759" opacity="0.9">
    <animateMotion dur="2.5s" begin="1.2s" repeatCount="indefinite" path="M160,140 L1040,140"/>
  </circle>
  <circle r="2.5" fill="#5B6CFF" opacity="0.7">
    <animateMotion dur="2.5s" begin="1.8s" repeatCount="indefinite" path="M160,140 L1040,140"/>
  </circle>

  <!-- vertical drops to cards -->
  <line x1="190" y1="140" x2="190" y2="168" stroke="#E5E5EA" stroke-width="1.5"/>
  <line x1="470" y1="140" x2="470" y2="168" stroke="#E5E5EA" stroke-width="1.5"/>
  <line x1="750" y1="140" x2="750" y2="168" stroke="#E5E5EA" stroke-width="1.5"/>
  <line x1="1030" y1="140" x2="1030" y2="168" stroke="#E5E5EA" stroke-width="1.5"/>
  <circle r="2.5" fill="#5B6CFF"><animateMotion dur="1.1s" repeatCount="indefinite" path="M190,140 L190,168"/></circle>
  <circle r="2.5" fill="#5B6CFF"><animateMotion dur="1.1s" begin="0.25s" repeatCount="indefinite" path="M470,140 L470,168"/></circle>
  <circle r="2.5" fill="#5B6CFF"><animateMotion dur="1.1s" begin="0.5s" repeatCount="indefinite" path="M750,140 L750,168"/></circle>
  <circle r="2.5" fill="#34C759"><animateMotion dur="1.1s" begin="0.75s" repeatCount="indefinite" path="M1030,140 L1030,168"/></circle>

  <g font-family="SF Pro Text, Inter, -apple-system, sans-serif">
    <rect x="48" y="168" width="264" height="112" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#ctaSh)"/>
    <rect x="48" y="168" width="264" height="112" rx="18" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.2;0.22;0.4;0.7;0.98;1" dur="6.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="76" cy="196" r="5" fill="#5B6CFF">
      <animate attributeName="r" values="4;7;4" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="96" y="202" font-size="15" font-weight="600" fill="#1D1D1F">Research</text>
    <text x="76" y="234" font-size="13" fill="#6E6E73">Legal AI architecture</text>
    <text x="76" y="254" font-size="12" fill="#86868B">institutions · labs</text>

    <rect x="328" y="168" width="264" height="112" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#ctaSh)"/>
    <rect x="328" y="168" width="264" height="112" rx="18" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.2;0.22;0.42;0.44;0.7;1" dur="6.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="356" cy="196" r="5" fill="#D2D2D7">
      <animate attributeName="fill" values="#D2D2D7;#D2D2D7;#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7" keyTimes="0;0.2;0.22;0.42;0.44;1" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;5;7;7;5;5" keyTimes="0;0.2;0.22;0.42;0.44;1" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <text x="376" y="202" font-size="15" font-weight="600" fill="#1D1D1F">Consulting</text>
    <text x="356" y="234" font-size="13" fill="#6E6E73">Agents · RAG · eval</text>
    <text x="356" y="254" font-size="12" fill="#86868B">legal / public orgs</text>

    <rect x="608" y="168" width="264" height="112" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#ctaSh)"/>
    <rect x="608" y="168" width="264" height="112" rx="18" fill="none" stroke="#5B6CFF" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.46;0.66;0.68;1" dur="6.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="636" cy="196" r="5" fill="#D2D2D7">
      <animate attributeName="fill" values="#D2D2D7;#D2D2D7;#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7" keyTimes="0;0.44;0.46;0.66;0.68;1" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;5;7;7;5;5" keyTimes="0;0.44;0.46;0.66;0.68;1" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <text x="656" y="202" font-size="15" font-weight="600" fill="#1D1D1F">Partnerships</text>
    <text x="636" y="234" font-size="13" fill="#6E6E73">LegalTech · proptech</text>
    <text x="636" y="254" font-size="12" fill="#86868B">3D platforms · agents</text>

    <rect x="888" y="168" width="264" height="112" rx="18" fill="#FFFFFF" stroke="#ECECEF" filter="url(#ctaSh)"/>
    <rect x="888" y="168" width="264" height="112" rx="18" fill="none" stroke="#34C759" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.7;0.72;0.94;0.96;1" dur="6.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="916" cy="196" r="5" fill="#34C759">
      <animate attributeName="r" values="4;7.5;4" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="936" y="202" font-size="15" font-weight="600" fill="#1D1D1F">Build together</text>
    <text x="916" y="234" font-size="13" fill="#6E6E73">Spec-driven greenfield</text>
    <text x="916" y="254" font-size="12" fill="#86868B">architecture → harness</text>
  </g>

  <text x="48" y="304" font-family="SF Pro Text, Inter, sans-serif" font-size="12" fill="#86868B">Next step: LinkedIn — share the problem space and constraints.</text>
</svg>
