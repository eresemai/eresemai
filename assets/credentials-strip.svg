    <text x="80" y="222" font-size="11" fill="#86868B">domain layer</text>

    <!-- LL.M. -->
    <rect x="328" y="100" width="264" height="140" rx="20" fill="#FFFFFF" stroke="#ECECEF" filter="url(#crSh)"/>
    <rect x="328" y="100" width="264" height="140" rx="20" fill="none" stroke="#5B6CFF" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.2;0.22;0.42;0.44;0.7;1" dur="7s" repeatCount="indefinite"/>
