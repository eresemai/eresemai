    <text x="640" y="198" font-size="13" fill="#6E6E73">integration certs</text>
    <text x="640" y="222" font-size="11" fill="#86868B">Fwdays · 2025–2026</text>

    <!-- Managing Partner -->
    <rect x="888" y="100" width="264" height="140" rx="20" fill="#FFFFFF" stroke="#ECECEF" filter="url(#crSh)"/>
    <rect x="888" y="100" width="264" height="140" rx="20" fill="none" stroke="#34C759" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.7;0.72;0.94;0.96;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cx="920" cy="136" r="5" fill="#34C759">
      <animate attributeName="r" values="4;7.5;4" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="940" y="142" font-size="15" font-weight="600" fill="#1D1D1F">ERESEM</text>
    <text x="920" y="178" font-size="13" fill="#6E6E73">Managing Partner</text>
    <text x="920" y="198" font-size="13" fill="#6E6E73">Law Firm · since 2018</text>
    <text x="920" y="222" font-size="11" fill="#86868B">operator · founder</text>
