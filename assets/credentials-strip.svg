<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">Credentials — 21y law · LL.M. · Agentic Engineering · ERESEM Managing Partner</title>
  <desc id="d">Animated qualifications strip with sequential highlight cards and connector packets.</desc>
  <defs>
    <filter id="crSh" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.045"/>
    </filter>
    <linearGradient id="crFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B6CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5B6CFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5B6CFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="1.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" fill="#FBFBFD"/>
  <text x="48" y="36" font-family="SF Pro Display, Inter, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="3.5" fill="#86868B">ERESEMAI</text>
  <text x="48" y="68" font-family="SF Pro Display, Inter, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#1D1D1F">Credentials</text>

  <line x1="100" y1="170" x2="1100" y2="170" stroke="#E5E5EA" stroke-width="2"/>
  <line x1="100" y1="170" x2="1100" y2="170" stroke="url(#crFlow)" stroke-width="3"/>

  <circle r="4.5" fill="#5B6CFF">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M172,170 L1028,170"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="0.65s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#5B6CFF" opacity="0.8">
    <animateMotion dur="2.8s" begin="0.7s" repeatCount="indefinite" path="M172,170 L1028,170"/>
  </circle>
  <circle r="3.5" fill="#34C759" opacity="0.9">
    <animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite" path="M172,170 L1028,170"/>
  </circle>
  <circle r="2.5" fill="#5B6CFF" opacity="0.7">
    <animateMotion dur="2.8s" begin="2.1s" repeatCount="indefinite" path="M172,170 L1028,170"/>
  </circle>

  <g font-family="SF Pro Text, Inter, -apple-system, sans-serif">
    <!-- 21y law -->
    <rect x="48" y="100" width="264" height="140" rx="20" fill="#FFFFFF" stroke="#ECECEF" filter="url(#crSh)"/>
    <rect x="48" y="100" width="264" height="140" rx="20" fill="none" stroke="#5B6CFF" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.2;0.22;0.4;0.7;0.98;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cx="80" cy="136" r="6" fill="#5B6CFF">
