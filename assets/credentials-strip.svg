    <text x="360" y="222" font-size="11" fill="#86868B">+ Jurisprudence LL.M.</text>

    <!-- Agentic certs -->
    <rect x="608" y="100" width="264" height="140" rx="20" fill="#FFFFFF" stroke="#ECECEF" filter="url(#crSh)"/>
    <rect x="608" y="100" width="264" height="140" rx="20" fill="none" stroke="#5B6CFF" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.46;0.66;0.68;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cx="640" cy="136" r="5" fill="#D2D2D7">
      <animate attributeName="fill" values="#D2D2D7;#D2D2D7;#5B6CFF;#5B6CFF;#D2D2D7;#D2D2D7" keyTimes="0;0.44;0.46;0.66;0.68;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;5;8;8;5;5" keyTimes="0;0.44;0.46;0.66;0.68;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <text x="660" y="142" font-size="15" font-weight="600" fill="#1D1D1F">Agentic Engineering</text>
